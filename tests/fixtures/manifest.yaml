# Runtime fixture manifest — AI test-asset governance (ADR-0034 prerequisite, Stage 2)
#
# Problem this file solves
# -------------------------
# `ci-runtime` is named "full AI-stack validation", but its real visual-inference
# path (YOLO smoke on person.jpg + CAVIAR scenario E2E) was silently SKIPPED because
# the assets are .gitignored and never acquired in CI -> false green. See
# .github/workflows/README.md (Principles #6 + "Runtime fixtures").
#
# An AI test asset is NOT a pip dependency. It needs governance metadata a package
# manager does not provide:
#   id        stable identifier used by scripts/fixture_manager.py
#   type      image | video | model | dataset | audio
#   path      repo-relative location checked for presence.
#              MUST resolve to a git-tracked or otherwise controlled location
#              under the repo root. A symlink is accepted only if it resolves
#              INSIDE the repo (fixture_manager.py warns when a link escapes root).
#   source    human-facing provenance / attribution page
#   acquire   how `--acquire` materialises it (method: http-file | script)
#   sha256    content hash; enforced whenever non-null. REQUIRED for http-file
#             acquisition — a null hash blocks the download rather than
#             permitting an unverifiable one (bootstrap with --allow-unpinned).
#   structure integrity check for *derived* directory fixtures that cannot be
#             content-hashed (see caviar_doorway below)
#   license   attribution / redistribution terms
#   required_for  test nodeids that MUST NOT run without this asset
#
# Download security (implemented in scripts/fixture_manager.py::_secure_download)
# -------------------------------------------------------------------------------
#   * HTTPS-only. A plain http:// source is REJECTED, never silently upgraded —
#     a silent transformation is the same class of bug as a silent skip.
#   * Redirects are restricted to ALLOWED_DOWNLOAD_HOSTS; a 302 cannot walk the
#     download to an arbitrary origin.
#   * Body is streamed in 1 MiB chunks to a `.part` file under a hard size cap,
#     hashed, and only then atomically renamed — a failed/tampered download
#     leaves nothing that a later run could mistake for a valid fixture.
#   * `sha256` is a strong post-download gate, not a hint.
#
# Why urls are pinned to immutable refs
#   `.../ultralytics/main/...` would let upstream silently change the bytes under
#   a pinned hash and break CI. Tagged refs (v8.3.0) are immutable.
#
# ci-runtime's `prepare-runtime-fixtures` step runs
#   python scripts/fixture_manager.py --manifest tests/fixtures/manifest.yaml --acquire --strict
# which FAILS CLOSED (exit 1) when a required fixture is missing, checksum-mismatched
# or structurally incomplete. No more silent skip.

fixtures:
  - id: person_smoke
    type: image
    description: YOLO smoke golden asset (ultralytics official example, multi-person street scene)
    path: tests/fixtures/person.jpg
    source: https://github.com/ultralytics/ultralytics/blob/v8.3.0/ultralytics/assets/bus.jpg
    acquire:
      method: http-file
      url: https://raw.githubusercontent.com/ultralytics/ultralytics/v8.3.0/ultralytics/assets/bus.jpg
    sha256: c02019c4979c191eb739ddd944445ef408dad5679acab6fd520ef9d434bfbc63
    license: Ultralytics YOLO example asset, AGPL-3.0 upstream (attribution required)
    required_for:
      - tests.test_tracker::test_real_yolo_track_produces_stable_track_id
      - tests.test_tracker::test_real_visitor_tracker_lifecycle

  - id: caviar_doorway
    type: video
    description: CAVIAR surveillance scene frames (one_stop_enter / one_leave_reenter / meet_walk_together)
    path: tests/fixtures/doorway
    source:
      - https://homepages.inf.ed.ac.uk/rbf/CAVIARDATA1
      - https://homepages.inf.ed.ac.uk/rbf/CAVIARDATA2
    acquire:
      method: script
      script: tests/fixtures/download_fixtures.py
      timeout_seconds: 1800
    # No sha256: these JPGs are DERIVED by ffmpeg, whose output is not
    # bit-reproducible across versions/platforms — a pinned digest would fail on
    # any runner with a different ffmpeg build. Integrity is anchored one level
    # up instead: download_fixtures.py pins the sha256 of each upstream .mpg,
    # and `structure` below asserts what the extraction actually produced.
    sha256: null
    structure:
      require_subdirs:
        - one_stop_enter
        - one_leave_reenter
        - meet_walk_together
      min_files_per_subdir: 20
    license: CAVIAR project (EC IST 2001 37540), free, attribute to CAVIAR
    required_for:
      - tests.demo.test_sources::test_caviar_jpg_frame_source_yields_frames
      - tests.demo.test_sources::test_caviar_jpg_frame_source_loop_replay
      - tests.demo.test_sources::test_build_frame_source_caviar
      - tests.test_action::test_caviar_end_to_end_pipeline_emits_action_command
      - tests.test_event::test_caviar_one_stop_enter_generates_visitor_event
      - tests.test_feature::test_caviar_end_to_end_pipeline_yields_risk_features
      - tests.test_integration::test_caviar_end_to_end_full_pipeline
      - tests.test_rule::test_caviar_end_to_end_pipeline_yields_perception_events
      - tests.test_runtime::test_caviar_end_to_end_via_runtime
      - tests.test_runtime::test_run_demo_end_to_end
      - tests.test_tracker::test_caviar_one_stop_enter_detects_person
      - tests.test_tracker::test_caviar_one_stop_enter_visitor_tracker_active
      - tests.test_tracker::test_caviar_one_leave_reenter_visitor_lifecycle
      - tests.test_tracker::test_caviar_meet_walk_together_detects_multi_person
      - tests.test_tracker::test_caviar_meet_walk_together_track_id_unique_in_frame
      - tests.test_warning::test_caviar_end_to_end_pipeline_yields_decision
