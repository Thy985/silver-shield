# ADR-0032 横向打分集场景示例（D8 registry 目录分层演示）。
# 声明式几何场景：odd hour + 长停留 → 触发 visit_normal（odd_hour 叠加）+ abnormal_dwell，
# 供 ADR-0033 Benchmark Harness 横向打分。
meta:
  schema_version: "1.0"
  scenario_id: sw_benchmark_night_dwell
  version: 1
  description: "Benchmark: night long dwell (odd hour + abnormal_dwell)"
  seed: 99
  # 帧数须同时满足两个运行时阈值（ADR-0033 端到端首次实测校正）：
  # ① abnormal_dwell 需逻辑停留 >= long_duration_seconds(300s)：(610-3)*0.5s = 303.5s ✓
  # ② 离场判定需尾部空缺 >= absence_gap_s(5s)：(659-610)*0.5s = 24.5s ✓（不离场则无 VisitorEvent）
  duration_frames: 660
  owner: perception-team
  category: visitor
  difficulty: high
  tags: [night, dwell, benchmark]
mode: detections
camera:
  resolution: [384, 288]
  fps: 2
  viewpoint: "front-door"
environment:
  scene_type: home_entry
  regions:
    entrance: [0.0, 0.4, 0.4, 1.0]
    corridor: [0.4, 0.0, 1.0, 1.0]
  static_objects: []
actors:
  - id: visitor_b
    actor_type: human
    tracks:
      - frame: 3
        pos: [130.0, 130.0]
        size: [40.0, 120.0]
      - frame: 610
        pos: [240.0, 130.0]
        size: [40.0, 120.0]
    objects: []
    appearance: {}
timeline:
  - frame: 620
    type: abnormal_dwell
expects:
  emitted_event_types: [visit_normal, abnormal_dwell]
  min_risk_level: LOW
# ADR-0033 D3：安全评价标签，由场景作者显式声明，**不从 expects 推导**。
# ScenarioValidator 不消费本字段（验证 ≠ 评价）。
benchmark:
  expected_alarm: true
  severity: LOW
  note: "凌晨长停留属可疑徘徊，期望触发告警提醒家属"
