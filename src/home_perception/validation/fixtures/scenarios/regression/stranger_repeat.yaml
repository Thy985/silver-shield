# ADR-0032 回归守护场景示例（D8 registry 目录分层演示）。
# 声明式几何场景：单 human 长停留（>=300s 逻辑时长）→ 触发 abnormal_dwell。
meta:
  schema_version: "1.0"
  scenario_id: stranger_long_dwell
  version: 1
  description: "Regression: single human long dwell -> abnormal_dwell"
  seed: 7
  # 帧数须同时满足两个运行时阈值（ADR-0033 端到端首次实测校正）：
  # ① abnormal_dwell 需逻辑停留 >= long_duration_seconds(300s)：(608-2)*0.5s = 303.0s ✓
  # ② 离场判定需尾部空缺 >= absence_gap_s(5s)：(659-608)*0.5s = 25.5s ✓（不离场则无 VisitorEvent）
  duration_frames: 660
  owner: perception-team
  category: visitor
  difficulty: medium
  tags: [dwell, regression]
mode: detections
camera:
  resolution: [384, 288]
  fps: 2
  viewpoint: "front-door"
environment:
  scene_type: home_entry
  regions:
    living_room: [0.4, 0.0, 1.0, 1.0]
  static_objects: []
actors:
  - id: visitor_a
    actor_type: human
    tracks:
      - frame: 2
        pos: [150.0, 140.0]
        size: [40.0, 120.0]
      - frame: 608
        pos: [200.0, 140.0]
        size: [40.0, 120.0]
    objects: []
    appearance: {}
timeline:
  - frame: 620
    type: abnormal_dwell
expects:
  emitted_event_types: [abnormal_dwell]
  min_risk_level: LOW
