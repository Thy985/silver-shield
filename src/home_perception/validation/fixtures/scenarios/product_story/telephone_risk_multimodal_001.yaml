# Product Story Fixture · risk case（ADR-0044 契约 v1 实例）
#
# 叙事：电话持续交互期间门前出现人物，多模态证据时间重叠触发风险升级与家属通知。
# provenance = synthetic_replay：audio 预录事件注入 + vision detections runtime 计算。
# Risk 升级由视觉 abnormal_dwell 驱动（既有行为）；audio 提供 evidence/叙事层，
# 不接通 audio→risk 直达链（ADR-0040 硬门控保持）。
#
# 时间基准：2026-08-23T12:00:00 UTC = 1756036800.0；duration_frames=120 @ 2fps → 60s。
meta:
  schema_version: "1.0"
  scenario_id: telephone_risk_multimodal_001
  product_question: "多模态证据如何讲一个完整的电话风险故事"
  version: 1
  description: "Product Story risk: 电话持续交互 + 门前人物出现 + 时间重叠 → Combined Evidence → Risk → Action"
  seed: 42
  duration_frames: 120
  owner: perception-team
  category: risk
  difficulty: medium
  tags: [product_story, telephone_risk, multimodal, risk]
  rule_overrides:
    long_duration_seconds: 30.0
mode: detections
camera:
  resolution: [384, 288]
  fps: 2
  viewpoint: "front-door"
environment:
  scene_type: home_entry
  regions:
    entrance: [0.0, 0.4, 0.4, 1.0]
  static_objects: []
actors:
  - id: stranger_a
    actor_type: human
    tracks:
      - frame: 40
        pos: [130.0, 130.0]
        size: [40.0, 120.0]
      - frame: 100
        pos: [180.0, 130.0]
        size: [40.0, 120.0]
    objects: []
    appearance: {}
timeline:
  - frame: 100
    type: abnormal_dwell
expects:
  emitted_event_types: [abnormal_dwell]
  min_risk_level: LOW
benchmark:
  expected_alarm: true
  severity: LOW
  note: "电话持续交互 + 门前人物出现 + 时间重叠 → 多模态证据升级"
integration:
  perception:
    min_perception_events: 1
  decision:
    outcome: WARN
  action:
    expected_notification: true
    expected_command_types: [LOG_ONLY]
  memory:
    min_records: 2
  cross_modal:
    min_links: 1
    expected_linked_modalities: [vision, audio]
    required_relationships: [supports]
# ---- ADR-0044 契约 v1 持续区间 audio（8 枚 · Owner 硬约束 1 满足）----
