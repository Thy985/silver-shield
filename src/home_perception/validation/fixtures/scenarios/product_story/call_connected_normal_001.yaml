# 核心命题验证：「识别到电话 ≠ 识别到诈骗风险」
#   telephone_persistent evidence 成立 + 正常双向对话 + 无可疑视觉证据
#   → MONITOR、不升级、不通知家属
#
# 这是比 golden_benign（空门厅无感知→不报警）更强的 benign 层级：
#   有感知信号（电话交互）但不构成风险 → 系统知道「有电话」且知道「不升级」。
#
# audio-native path（ADR-0040 D6 升级 · ADR-0044）：audio 产出 LOW + MONITOR warning（证据面）；
# 无视觉 actor → 无 abnormal_dwell → 无视觉 risk 驱动 → 不通知家属（LOG_ONLY）。
# 核心命题：「识别到电话 ≠ 识别到诈骗风险」——系统知道「有电话」(LOW+MONITOR) 且知道「不升级」(不通知)。
