# ADR-0034 Phase B.2 · Audio E2E Verification Case（专用确定性音频端到端验证场景）。
# 目的不是产品化，而是先证明整条链闭环：
#   Audio Source → Audio Runtime → AudioPerceptionEvent → Memory
#   → CrossModalLink → Decision → Action → IntegrationReport
# 最终 canonical 必须真出现 audio_evidence>0 且 cross_modal_links>0（不是只有 schema）。
#
# 蓝本：adr0034_cross_modal.yaml（abnormal_dwell 几何，已实测产出 1 条视觉 episode）。
# 差异：audio 通道声明 3 枚不同声学感知事件，覆盖 ADR-0034 音频语义全谱：
#   telephone_persistent（持续通话）/ voice_raised（高声/争吵）/ distress_cry（哭诉/求助）。
# 时间戳跨越会话窗口，保证纯音频 episode 时间窗严格覆盖视觉 episode → CrossModalLinker 建边。
#
# 时间基准：clock_start = 2026-07-19 18:00:00 UTC = 1752952800.0 (Unix 秒)；
# duration_frames=660, frame_interval_s=0.5 → 会话窗口 [1752952800.0, 1752953130.0]。
# 三枚音频 @ 1752952800.0 / 1752952950.0(start+150s) / 1752953080.0(start+280s)，
# 跨度覆盖全会话，保证与视觉 episode 严格重叠。
meta:
  schema_version: "1.0"
  scenario_id: sw_adr0034_audio_e2e
  product_question: "系统能听见环境声音并作为证据参与判断"
  version: 1
  description: "ADR-0034 Audio E2E: abnormal_dwell + 3 audio kinds (telephone/voice_raised/distress_cry) -> real vision<->audio cross-modal link"
  seed: 99
  duration_frames: 660
  owner: perception-team
  category: visitor
  difficulty: high
  tags: [adr0034, cross_modal, audio_e2e, integration]
mode: detections
camera:
  resolution: [384, 288]
  fps: 2
  viewpoint: "front-door"
environment:
  scene_type: home_entry
  regions:
    entrance: [0.0, 0.4, 0.4, 1.0]
    corridor: [0.4, 0.0, 1.0, 1.0]
  static_objects: []
actors:
  - id: visitor_b
    actor_type: human
    tracks:
      - frame: 3
        pos: [130.0, 130.0]
        size: [40.0, 120.0]
      - frame: 610
        pos: [240.0, 130.0]
        size: [40.0, 120.0]
    objects: []
    appearance: {}
timeline:
  - frame: 620
    type: abnormal_dwell
expects:
  emitted_event_types: [abnormal_dwell]
  min_risk_level: LOW
benchmark:
  expected_alarm: true
  severity: LOW
  note: "凌晨长停留 + 持续通话/高声/哭诉，视觉与音频共同指向可疑徘徊"
# ADR-0034 D4：闭环集成期望（opt-in，仅 IntegrationValidator 消费）。
integration:
  perception:
    min_perception_events: 1
  decision:
    outcome: WARN
  action:
    expected_notification: true
    expected_command_types: [LOG_ONLY]
  memory:
    min_records: 2   # 视觉 episode + 音频 episode
  cross_modal:
    min_links: 1
    expected_linked_modalities: [vision, audio]
    required_relationships: [supports]
# ADR-0034 Phase B.2：音频通道（跨模态关联来源）。
# 三枚不同声学感知事件，时间戳跨越会话窗口，保证与视觉 episode 时间窗严格重叠。
audio:
  - kind: audio_telephone_persistent
    timestamp: 1752952800.0   # 首帧：2026-07-19 18:00:00 UTC
    score: 0.9
    confidence: 0.9
    source_segment_ids: ["seg-0"]
    labels: ["telephone"]
  - kind: audio_voice_raised
    timestamp: 1752952950.0   # 中段：start + 150s = 2026-07-19 18:02:30 UTC
    score: 0.85
    confidence: 0.88
    source_segment_ids: ["seg-1"]
    labels: ["speech", "loud"]
  - kind: audio_distress_cry
    timestamp: 1752953080.0   # 后段：start + 280s = 2026-07-19 18:04:40 UTC
    score: 0.92
    confidence: 0.9
    source_segment_ids: ["seg-2"]
    labels: ["speech", "distress"]
