# ADR-0034 Phase B.1 · 老人夜间异常停留 fixture（Memory 深度断言）。
# 几何与帧序列拷贝自 adr0034_alarm.yaml（同一 abnormal_dwell 触发路径，确定性可复现）：
#   - 凌晨长停留 → abnormal_dwell 事件
#   - 期望闭环：WARN(LOW) + LOG_ONLY 命令 + 至少 1 条 episodic 落库（vision 模态）
# 与 alarm fixture 的唯一差异：本 fixture 的 `integration.memory` 块**声明 Phase B.1
# 结构化字段**（expected_risk_level / expected_action_types / required_modalities），
# 用于驱动 F4 的结构化断言（而非仅条数下界）。
meta:
  schema_version: "1.0"
  scenario_id: sw_adr0034_elderly_dwell
  version: 1
  description: "ADR-0034 Phase B.1: 老人夜间异常停留 -> abnormal_dwell -> WARN(LOW) + LOG_ONLY + episode(vision)"
  seed: 99
  # 帧数须同时满足两个运行时阈值（ADR-0033 端到端首次实测校正）：
  # ① abnormal_dwell 需逻辑停留 >= long_duration_seconds(300s)：(610-3)*0.5s = 303.5s ✓
  # ② 离场判定需尾部空缺 >= absence_gap_s(5s)：(659-610)*0.5s = 24.5s ✓（不离场则无 VisitorEvent）
  duration_frames: 660
  owner: perception-team
  category: elderly
  difficulty: high
  tags: [adr0034, elderly_dwell, memory, integration]
mode: detections
camera:
  resolution: [384, 288]
  fps: 2
  viewpoint: "front-door"
environment:
  scene_type: home_entry
  regions:
    entrance: [0.0, 0.4, 0.4, 1.0]
    corridor: [0.4, 0.0, 1.0, 1.0]
  static_objects: []
actors:
  - id: elder_a
    actor_type: human
    tracks:
      - frame: 3
        pos: [130.0, 130.0]
        size: [40.0, 120.0]
      - frame: 610
        pos: [240.0, 130.0]
        size: [40.0, 120.0]
    objects: []
    appearance: {}
timeline:
  - frame: 620
    type: abnormal_dwell
expects:
  emitted_event_types: [abnormal_dwell]
  min_risk_level: LOW
# ADR-0033 D3：安全评价标签，由场景作者显式声明。
benchmark:
  expected_alarm: true
  severity: LOW
  note: "老人凌晨于门口长时间逗留，属可疑徘徊，期望触发告警提醒家属"
# ADR-0034 D4：闭环集成期望（opt-in，仅 IntegrationValidator 消费）。
# Phase B.1：memory 块在条数下界之外，额外声明结构化断言。
integration:
  perception:
    min_perception_events: 1
  decision:
    outcome: WARN
  action:
    expected_notification: true
    expected_command_types: [LOG_ONLY]
  memory:
    min_records: 1
    expected_risk_level: LOW
    expected_action_types: [LOG_ONLY]
    required_modalities: [vision]
