# Golden Case：evidence_insufficient — 证据不足克制叙事
#
# 目的：验证"证据不足时系统克制不报警"的核心产品价值
#   - 视觉：可能有人、可能无人、模糊边界
#   - 音频：无明确异常音频事件
#   - 预期：全程 MONITOR → 最终 NOT_TRIGGERED（不触发任何行动）
#   - 无历史记忆、无声学状态变化
#   - 验证 VM-9：不调用 ASR/LLM，不推导心理，不判定诈骗
#
# 关键设计：
#   - 选择 act_a 作为代表（单一变体，避免混淆）
#   - 预期：risk_levels 全程 LOW/MEDIUM，最终 gate_passed=false
#   - Viewer ①-⑥ 全部呈现"观察中、未触发、克制"态
#
# 运行方式：
#   python scripts/run_demo.py --live --scenario golden_evidence_insufficient

scenario_id: golden_evidence_insufficient
description: |
  Golden Case：evidence_insufficient 证据不足克制叙事
  演示系统在模糊边界下的克制：全程 MONITOR，最终 NOT_TRIGGERED，不推送任何通知。
  验证 VM-9：不调用 ASR/LLM，不推导当事人心理，不判定诈骗。

source: evidence_insufficient
source_type: caviar_jpg

start_time: "2026-08-12T10:00:00+00:00"
frame_interval_s: 0.5
fps_target: 8
loop: true

# 使用 act_a 变体（证据不足的代表性片段）
media_path: data/golden/evidence_insufficient/output/act_a_final.mp4
audio_path: data/golden/evidence_insufficient/audio_mix/act_a_mix.wav