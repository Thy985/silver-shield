# delivery_courier_normal 场景（真实视频验证 · P0-11.3 产品展示层）
#
# 真实监控录像：外卖小哥正常送包裹（演示者提供的真实素材，
# 置于 data/demo/Delivery_Courier_Final.mp4，gitignore 不入库）。
#
# 验证目标（正常剧本 / 对照基线）：
# - VideoFileFrameSource 解码真实 MP4
# - 白天（start_time 14:00 UTC → OddHourRule 不触发）
# - 单次来访（仅 1 次进出 → repeat_visit 不触发）
# - 结论：系统应「看到人 ≠ 报警」——至多 visit_normal / 轻微 abnormal_dwell(LOW)，
#   绝不升级为 HIGH。这正是银龄盾与普通视觉模型的区别：靠时间/频率/行为组合判定，
#   而非对单帧人物做「可疑」标签。
#
# 与 cctv_surveillance_suspicious 形成「正常 vs 异常」对照，统一经冻结架构：
# Dashboard / Pipeline / WarningEvent 零改动。
scenario_id: delivery_courier_normal
description: |
  真实监控录像（外卖小哥正常送包裹）。白天正常单次来访剧本：验证「看到人 ≠ 报警」。
  系统应仅产生低/无风险事件，不升级为 HIGH，与 cctv_surveillance_suspicious
  形成「正常 vs 异常」对照，凸显行为组合分析价值。
  视频文件置于 data/demo/Delivery_Courier_Final.mp4（gitignore，不入库；由演示者提供）。

source: delivery_courier
source_type: video_file
media_path: data/demo/Delivery_Courier_Final.mp4
start_time: "2026-07-19T14:00:00+00:00"   # 白天，OddHourRule 不触发
frame_interval_s: 0.5
fps_target: 8
loop: false                              # 验证：整段跑一遍即可
