name: CI

on:
  # 触发作用域收敛（Repository Reliability System，取自 math2）：
  # push 仅监听 main → 主干合入后的 Release CI；feature 分支统一由 PR 触发验证，
  # 彻底消除「同 commit 跑 push+PR 两次」的双触发，省算力且反馈更快。
  # 配合 .githooks/pre-push 本地守门（scripts/preflight.sh）形成双保险。
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12'

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install ruff
        # 锁版本：ruff 0.16 起默认规则集变严（新增 I001 import 排序 / RUF022 __all__ 排序 /
        # UP 系列类型注解现代化 / DTZ001 等）。此前因 src+tests 累计 907 处违规曾 pin 回 0.15.22。
        # 本 PR（fix/ruff-best-practices）已全量对齐 0.16 默认规则集（ruff check src tests 全绿，
        # pytest 648 passed），故解锁升级到 0.16.1。
        # 如需升级，请先本地 `ruff==<new> check src tests` 全绿后再改此行。
        run: pip install ruff==0.16.1
      - name: Run ruff
        run: ruff check src tests

  # 阶段一致性锁：README「当前状态」= SSOT，AGENTS §10 / Roadmap §8.2 为投影。
  # 脚本只读、加法型，仅用 Python 标准库（无依赖），退出码 0=一致 / 1=漂移 / 2=输入错误。
  # 漂移即 PR 阻塞——防止文档间状态不一致悄然合入。
  phase-consistency:
    name: Phase consistency (SSOT lock)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Run phase consistency check
        run: python scripts/phase_consistency_check.py

  # torch-free 契约/仪表盘测试：每 PR 运行，不安装 AI 栈（torch/ultralytics/opencv）。
  # 这些测试只 import 轻量模块（config / action.command / analysis.* / 仪表盘 HTML 文本），
  # 在 `pip install --no-deps -e .` + 轻量依赖下即可跑通。
  test-contracts:
    name: Contract & Dashboard tests (torch-free)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install torch-free deps
        run: |
          pip install --no-deps -e .
          pip install pytest pytest-asyncio pydantic pyyaml structlog numpy
      - name: Run torch-free subset
        run: |
          pytest \
            tests/contract/test_config_contract.py \
            tests/contract/test_state_machine_contract.py \
            tests/contract/test_schema_contract.py \
            tests/demo/test_dashboard_p0_11_4.py \
            tests/demo/test_dashboard_state_layer.py \
            tests/demo/test_dashboard_video_input.py \
            tests/demo/test_freeze_boundary.py

  # 完整运行时测试：需要 AI 栈（torch/ultralytics/opencv），仅 main 合入或手动触发时运行，
  # 避免每 PR 强行安装整个 AI 栈（CI 不依赖 GPU 环境；PyPI torch 默认 CPU 构建）。
  test-runtime:
    name: Full runtime tests (AI stack)
    runs-on: ubuntu-latest
    needs: lint
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install full deps (CPU torch)
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -e .
      - name: Run full suite
        run: pytest
