name: CI

on:
  # 触发作用域收敛（Repository Reliability System，取自 math2）：
  # push 仅监听 main → 主干合入后的 Release CI；feature 分支统一由 PR 触发验证，
  # 彻底消除「同 commit 跑 push+PR 两次」的双触发，省算力且反馈更快。
  # 配合 .githooks/pre-push 本地守门（scripts/preflight.sh）形成双保险。
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12'

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install ruff
        # 锁版本：ruff 0.16 起默认规则集变严（新增 I001 import 排序 / RUF022 __all__ 排序 /
        # UP 系列类型注解现代化 / DTZ001 等）。此前因 src+tests 累计 907 处违规曾 pin 回 0.15.22。
        # 本 PR（fix/ruff-best-practices）已全量对齐 0.16 默认规则集（ruff check src tests 全绿，
        # pytest 648 passed），故解锁升级到 0.16.1。
        # 如需升级，请先本地 `ruff==<new> check src tests` 全绿后再改此行。
        run: pip install ruff==0.16.1
      - name: Run ruff
        run: ruff check src tests

  # 阶段一致性锁：README「当前状态」= SSOT，AGENTS §10 / Roadmap §8.2 为投影。
  # 脚本只读、加法型，仅用 Python 标准库（无依赖），退出码 0=一致 / 1=漂移 / 2=输入错误。
  # 漂移即 PR 阻塞——防止文档间状态不一致悄然合入。
  phase-consistency:
    name: Phase consistency (SSOT lock)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Run phase consistency check
        run: python scripts/phase_consistency_check.py

  # torch-free 契约/仪表盘测试：每 PR 运行，不安装 AI 栈（torch/ultralytics/opencv）。
  # 这些测试只 import 轻量模块（config / action.command / analysis.* / 仪表盘 HTML 文本），
  # 在 `pip install --no-deps -e .` + 轻量依赖下即可跑通。
  test-contracts:
    name: Contract & Dashboard tests (torch-free)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install torch-free deps
        run: |
          pip install --no-deps -e .
          pip install pytest pytest-asyncio pydantic pyyaml structlog numpy
      - name: Run torch-free subset
        run: |
          pytest \
            tests/contract/test_config_contract.py \
            tests/contract/test_state_machine_contract.py \
            tests/contract/test_schema_contract.py \
            tests/demo/test_dashboard_p0_11_4.py \
            tests/demo/test_dashboard_state_layer.py \
            tests/demo/test_dashboard_video_input.py \
            tests/demo/test_freeze_boundary.py \
            tests/test_audio_perception.py \
            tests/test_audio_scenarios.py \
            tests/test_audio_synthetic.py \
            tests/test_audio_tier1.py \
            tests/test_audio_units.py \
            tests/memory/consumer/test_audio_patterns.py \
            tests/memory/test_audio_memory_contract.py \
            tests/memory/test_memory_replay_audio.py

  # ADR-0033 Phase 3 生产门控（PR 级 CI gate）：Hard Gate 失败 → 非零退出，PR 拦截。
  # 跑门控 / 回归 / 度量 / bump 测试（只依赖 evaluation 内部 + opencv，无需 torch）；
  # 另含音频 recorder 测试（import 链 transitively 需 cv2，本 job 已装 opencv，不需 torch）；
  # 另加一次真实场景的 CLI --gate 端到端冒烟（需完整 AI 栈，故本 job 装全量依赖），
  # 报告上传为 artifact（失败可溯源）。pip + 模型权重走缓存以省重复下载。
  benchmark-gate:
    name: Benchmark gate (ADR-0033 Phase 3)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 完整历史：供 harness 指纹取 git 短哈希 + baseline diff
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          # pip 下载缓存：benchmark-gate 每轮要装 torch(~800MB CPU) + opencv，
          # 缓存后可省去重复下载，把 job 从「装依赖」瓶颈中解放（ADR-0033 CI 加固）。
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Cache model weights (YOLO/torch; 为 P1 真实 YOLO smoke 与 test-runtime 预热)
        # 权重不进 git/LFS，走缓存——避免权重版本变更污染仓库历史（ADR-0033 D4 契约）。
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ultralytics
            ~/.cache/torch
          key: models-${{ runner.os }}-v1
          restore-keys: |
            models-${{ runner.os }}-
      - name: Install deps (full AI stack, CPU torch)
        # benchmark 回归门禁专用约束：constraints-benchmark.txt 钉死 numpy/opencv/torch
        # 精确版本，使 committed baseline 可重放、跨时间/跨 OS 稳定（ADR-0033 D4 契约）。
        # 与 production requirements.txt 解耦——生产保持">="下限灵活，benchmark 走 constraints。
        # torch==2.11.0 在 linux 装出 2.11.0+cpu，经 harness.normalize_version 归一为 2.11.0，
        # 与开发机 2.11.0+cu130 归一结果一致 → runtime_dependencies 守恒(4/7) 跨 OS 通过。
        run: pip install -c constraints-benchmark.txt -r requirements-dev.txt
      # 本 job 装了 opencv（constraints-benchmark.txt 钉死 opencv-python），故可跑
      # tests/runtime/test_audio_session_recorder.py（其 import 链 transitively 需 cv2，
      # 但不需要 torch）——把音频 recorder 也纳入 PR 门禁，关闭音频侧 CI 盲区。
      - name: Run gate + regression + bump tests
        run: |
          pytest \
            tests/evaluation/test_benchmark_gate.py \
            tests/evaluation/test_benchmark_ab_runner.py \
            tests/evaluation/test_benchmark_metrics.py \
            tests/evaluation/test_baseline_bump_check.py \
            tests/runtime/test_audio_session_recorder.py -q
      - name: End-to-end CLI --gate smoke (real benchmark scenarios + baseline regression gate)
        run: |
          python scripts/run_benchmark.py \
            --scenarios src/home_perception/validation/fixtures/scenarios/benchmark \
            --set-id adr0033-phase1 \
            --baseline src/home_perception/evaluation/fixtures/baselines/adr0033-phase1.json \
            --max-regression-delta 0.05 \
            --gate --out /tmp/bench_gate_report.json
      # 报告上传为 artifact：门禁失败时 Owner 可直接从 run 下载 WHY（否则 /tmp 报告随 runner 销毁丢失）。
      # if: always() 保证即使前面 pytest 失败也尽力上传（报告可能未生成 → if-no-files-found: warn）。
      - name: Upload benchmark gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-gate-report
          path: /tmp/bench_gate_report.json
          if-no-files-found: warn

  # ADR-0033 D7 基线 bump 治理：基线 JSON 变更的 PR 必须注明 benchmark-baseline-bump（Owner 评审）。
  # 轻量（仅标准库脚本），仅 PR 触发。
  baseline-bump-check:
    name: Baseline bump governance (ADR-0033 D7)
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Collect PR marker text (title + body + commits)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            gh pr view ${{ github.event.pull_request.number }} \
              --json title,body --jq '.title + "\n" + (.body // "")' 2>/dev/null || true
            echo "---COMMITS---"
            git log origin/main..HEAD --pretty=%B 2>/dev/null || true
          } > /tmp/pr_marker.txt
      - name: Check baseline bump policy
        run: |
          python scripts/check_baseline_bump.py --base origin/main --marker-file /tmp/pr_marker.txt

  # 完整运行时测试：需要 AI 栈（torch/ultralytics/opencv），仅 main 合入或手动触发时运行，
  # 避免每 PR 强行安装整个 AI 栈（CI 不依赖 GPU 环境；PyPI torch 默认 CPU 构建）。
  test-runtime:
    name: Full runtime tests (AI stack)
    runs-on: ubuntu-latest
    needs: lint
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Cache model weights (YOLO/torch)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ultralytics
            ~/.cache/torch
          key: models-${{ runner.os }}-v1
          restore-keys: |
            models-${{ runner.os }}-
      - name: Install full deps (CPU torch)
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -e .
      - name: Run full suite
        run: pytest
