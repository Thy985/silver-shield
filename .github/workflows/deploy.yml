name: CD

# 持续部署（CD）：push 到 main 即部署到阿里云 ECS（Docker Compose over SSH）。
#
# 使用前请在仓库 Settings → Secrets and variables → Actions 配置以下 Secrets：
#   ALIYUN_HOST        ECS 公网 IP 或域名
#   ALIYUN_USERNAME    SSH 登录用户名（如 root / ecs-user）
#   ALIYUN_SSH_KEY     私钥内容（PEM，含 -----BEGIN ... -----END 整段）
#   ALIYUN_PORT        可选，SSH 端口，默认 22
#   DEPLOY_PATH        可选，服务器部署目录，默认 /opt/silvershield
#   DEMO_DATA_URL      可选，演示视频打包（tar.gz，内含 data/demo/*.mp4）的下载【直链】，
#                       须以 http:// 或 https:// 开头（如阿里云 OSS 预签名 URL）。
#                       视频被 .gitignore 忽略不入库；不配置或拉取失败均只告警、不阻断部署，
#                       此时面板无画面——可在 Dashboard UI 上传或手动 scp 到服务器 data/demo。
#
# 私有仓库拉取凭证：使用 Actions 自动注入的 GITHUB_TOKEN（见下方 permissions: contents: read），
#   无需人工生成 / 复制 / 粘贴任何密钥，因此不再需要 GH_DEPLOY_KEY，
#   Settings → Deploy keys 亦无需登记公钥。该 token 随 workflow 运行签发、结束即失效。
#
# 服务器前置条件：已安装 git 与 Docker（含 compose v2）；安全组放行 8765（dashboard）/ 1883（mqtt）。
#
# 部署内容（docker-compose.yml 的 3 个 service）：
#   mqtt          -> eclipse-mosquitto（本地 MQTT Broker）
#   home-perception -> scripts/run.py（完整感知管线，按 .env 配置）
#   dashboard     -> silver_demo.gateway（演示 Dashboard，含区域⑥ Memory Context Panel）

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

env:
  DEPLOY_PATH: /opt/silvershield

jobs:
  deploy:
    name: Deploy to Aliyun ECS (Docker Compose SSH)
    runs-on: ubuntu-latest
    # 仅授予本仓库只读权限：GITHUB_TOKEN 用于服务器侧 git fetch，最小权限原则
    permissions:
      contents: read
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          # 经 envs 传入远端 shell，避免 token 明文出现在 script 文本里
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.ALIYUN_HOST }}
          username: ${{ secrets.ALIYUN_USERNAME }}
          key: ${{ secrets.ALIYUN_SSH_KEY }}
          port: ${{ secrets.ALIYUN_PORT || 22 }}
          # 首次 docker compose build 需在 ECS(纯 CPU)上重装 torch/ultralytics/opencv，
          # 单次 pip install 常超 10 分钟。默认 command_timeout=10m 会误杀构建，放宽到 60m。
          # 首次构建命中缓存后，后续 --build 仅重跑 COPY 层、秒级完成。
          command_timeout: 60m
          envs: GH_TOKEN
          # 注意：不要开 script_stop。开启后 appboy 会在首个失败命令处立即切断 SSH，
          # 导致后续 echo / 报错输出被吞，CD 失败完全不可观测。这里靠 set -e 在失败时退出，
          # 由脚本自身的 >> [N] 标记定位卡点。
          script: |
            set -euo pipefail
            echo ">> [0] CD script start"
            DEPLOY_PATH="${{ env.DEPLOY_PATH }}"
            # 无凭证 URL：写入 .git/config，确保服务器上不残留任何 token
            REPO_URL="https://github.com/${{ github.repository }}.git"
            # 带凭证 URL：仅本次 fetch 一次性使用，随 workflow 结束失效
            AUTH_URL="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"

            # 1) 拉取最新代码，保证 CD 总是干净的最新主干
            #    兼容三种情况：已是 git 仓库 / 目录存在但非 git 仓库（手动部署遗留）/ 目录不存在
            echo ">> [1] ensure git repo at $DEPLOY_PATH"
            if [ ! -d "$DEPLOY_PATH/.git" ]; then
              # 目录不存在则新建；目录存在但非 git 仓库（多为手动部署遗留）则就地 init，
              # 保留 data/demo 等未纳入版本控制的演示视频，再硬重置到 origin/main
              mkdir -p "$DEPLOY_PATH"
              git -C "$DEPLOY_PATH" init -q
              git -C "$DEPLOY_PATH" remote add origin "$REPO_URL"
            fi
            cd "$DEPLOY_PATH"
            git remote set-url origin "$REPO_URL"

            echo ">> [2] git fetch main"
            git fetch --depth 1 "$AUTH_URL" main
            echo ">> [3] git reset --hard FETCH_HEAD"
            git reset --hard FETCH_HEAD

            # 2) 演示视频（被 .gitignore 忽略，不入库）：可选经对象存储拉取后解包到 data/demo
            #    演示视频是【可选】资源：URL 非法 / 下载失败 / 解包失败一律降级为 WARN，
            #    绝不阻断部署——没有视频服务照常起，可事后在 Dashboard UI 上传或 scp 补齐。
            echo ">> [4] demo video (skip if DEMO_DATA_URL empty / invalid)"
            DEMO_URL="${{ secrets.DEMO_DATA_URL }}"
            case "$DEMO_URL" in
              http://*|https://*)
                echo "==> 拉取演示视频包 (DEMO_DATA_URL)"
                mkdir -p data/demo
                if curl -fsSL --connect-timeout 15 --max-time 600 "$DEMO_URL" -o /tmp/demo_videos.tar.gz \
                   && tar -xzf /tmp/demo_videos.tar.gz -C data/demo; then
                  echo "==> 演示视频包已解包到 data/demo"
                else
                  echo "WARN: 演示视频包拉取或解包失败，已跳过（不阻断部署）。" >&2
                  echo "      请检查 DEMO_DATA_URL 是否为有效的 tar.gz 直链（OSS 预签名 URL 可能已过期）。" >&2
                fi
                rm -f /tmp/demo_videos.tar.gz
                ;;
              "")
                echo "==> 未配置 DEMO_DATA_URL：演示面板将无视频，可在 Dashboard UI 上传或手动 scp 到 $DEPLOY_PATH/data/demo"
                ;;
              *)
                echo "WARN: DEMO_DATA_URL 不是 http(s):// 开头的直链，已跳过（不阻断部署）。" >&2
                echo "      若该 Secret 填的是说明文字而非下载地址，请到 Settings -> Secrets 清空它。" >&2
                ;;
            esac

            # 3) 服务器无 .env 时用模板生成（home-perception 需要；dashboard 有默认值）
            echo ">> [5] ensure .env"
            if [ ! -f .env ] && [ -f .env.example ]; then
              cp .env.example .env
            fi

            # 4) 部署前校验 compose 合法（失败则阻断，避免坏部署）
            echo ">> [6] docker compose config -q"
            docker compose config -q

            # 5) 构建并启动全部 service（dashboard + home-perception + mqtt）
            echo ">> [7] docker compose up -d --build"
            docker compose up -d --build
            echo ">> [8] docker image prune -f"
            docker image prune -f
            echo ">> [9] CD done"
