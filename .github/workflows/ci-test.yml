name: CI Test

# 普通测试分层（torch-free，每 PR 运行，不装 AI 栈）。三档职责：
#   contract     接口/状态机/schema/配置契约（最轻）
#   unit         组件单测（DecisionEngine / Memory / Policy / Tracker / Rule / Warning …）证明单测不绑 torch
#   integration  真实闭环（Scenario→Tracker→Decision→Policy→Action，合成 detector 零模型）证明闭环有人跑
# 测试路径归属集中在 scripts/run_tests.py（单一事实来源），YAML 不散落 pytest 长路径列表。
# 每档统一产出 JUnit XML + coverage XML 到 artifacts/，失败后可下载溯源（CI 必须有 Artifact 能力）。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12'

jobs:
  contract:
    name: Contract tests (torch-free)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install torch-free deps (locked)
        run: |
          pip install -r requirements-ci.txt
          pip install -e . --no-deps
      - name: Run contract tier
        run: python scripts/run_tests.py --tier contract
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-contract
          path: |
            artifacts/junit-contract.xml
            artifacts/coverage-contract.xml
          if-no-files-found: warn

  unit:
    name: Unit tests (torch-free)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install torch-free deps (locked)
        run: |
          pip install -r requirements-ci.txt
          pip install -e . --no-deps
      - name: Run unit tier
        run: python scripts/run_tests.py --tier unit
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-unit
          path: |
            artifacts/junit-unit.xml
            artifacts/coverage-unit.xml
          if-no-files-found: warn

  integration:
    name: Integration tests (torch-free closed-loop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install torch-free deps (locked)
        run: |
          pip install -r requirements-ci.txt
          pip install -e . --no-deps
      - name: Run integration tier
        run: python scripts/run_tests.py --tier integration
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-integration
          path: |
            artifacts/junit-integration.xml
            artifacts/coverage-integration.xml
          if-no-files-found: warn

  # ADR-0034 Phase C：生产门禁（PR 级）。跑真实闭环 + Phase C gate 判定：
  # 退出码按 gate.passed（blocking 语义）——warning 失败仅标记 degraded 不拦合并；
  # canonical 报告 / gate 报告 / 指纹 artifact 全部落盘留痕。
  # 再叠加 DoD C4：loop 指纹基线漂移检测（漂移须 PR 注明 integration-baseline-bump）。
  integration-gate:
    name: Integration gate (ADR-0034 Phase C)
    runs-on: ubuntu-latest
    # PR 必跑 job 且执行 e2e 闭环（合成 detector + cv2 解析 + 双指纹），
    # 默认 360 分钟过长——15 分钟兜底足够，防 runner 卡死拖垮队列（评审 B8）。
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        # fetch-depth 0：check_integration_baseline.py 需 git diff base...HEAD 查基线文件变更
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install torch-free deps (locked)
        run: |
          pip install -r requirements-ci.txt
          pip install -e . --no-deps
      - name: Run integration gate (blocking semantics)
        run: python scripts/run_integration_validation.py --gate --strict
      - name: Collect PR marker text (title + body + commits)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            gh pr view ${{ github.event.pull_request.number }} \
              --json title,body --jq '.title + "\n" + (.body // "")' 2>/dev/null || true
            echo "---COMMITS---"
            git log origin/main..HEAD --pretty=%B 2>/dev/null || true
          } > /tmp/pr_marker.txt
      - name: Check loop fingerprint baseline (DoD C4 drift)
        # push 到 main：跳过基线文件变更治理（main 的基线变更来自已评审合并，squash
        # 提交信息/空 git log 无法承载标记，文件治理必然误拦）；漂移判定恒生效。
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            ARGS="--skip-file-policy"
          fi
          python scripts/check_integration_baseline.py \
            --current artifacts/adr0034_integration/adr0034_fingerprints.json \
            --baseline src/home_perception/integration/fixtures/baselines/loop_fingerprints.json \
            --marker-file /tmp/pr_marker.txt $ARGS
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-gate
          path: |
            artifacts/adr0034_integration/
          if-no-files-found: warn
