name: Claude Review
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  auto-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Analyze PR size
        id: analyze
        shell: bash
        run: |
          set +e
          DIFF=$(git diff --shortstat origin/$BASE_REF...HEAD 2>/dev/null)
          A=$(echo "$DIFF" | awk -F' ' '{for(i=1;i<=NF;i++) if($i~/insertion/) print $(i-1)}')
          D=$(echo "$DIFF" | awk -F' ' '{for(i=1;i<=NF;i++) if($i~/deletion/) print $(i-1)}')
          F=$(echo "$DIFF" | awk -F' ' '{for(i=1;i<=NF;i++) if($i~/file/) print $(i-1)}')
          set -e
          A=${A:-0}; D=${D:-0}; F=${F:-0}; T=$((A+D))
          echo "added=$A" >> "$GITHUB_OUTPUT"
          echo "deleted=$D" >> "$GITHUB_OUTPUT"
          echo "files=$F" >> "$GITHUB_OUTPUT"
          echo "total=$T" >> "$GITHUB_OUTPUT"
          if [ "$T" -le 30 ] && [ "$F" -le 3 ]; then MT=10
          elif [ "$T" -le 300 ] && [ "$F" -le 15 ]; then MT=20
          elif [ "$T" -le 1000 ] && [ "$F" -le 30 ]; then MT=30
          else MT=40; fi
          echo "max_turns=$MT" >> "$GITHUB_OUTPUT"
        env:
          BASE_REF: ${{ github.base_ref }}

      - uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_BASE_URL: https://api.deepseek.com/anthropic
          ANTHROPIC_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          track_progress: true
          prompt: |
            PR: ${{ github.event.pull_request.title }}
            Changes: ${{ steps.analyze.outputs.added }}+/${{ steps.analyze.outputs.deleted }}- in ${{ steps.analyze.outputs.files }} files.

            Review this PR with focus on: code quality, bugs, security, tests, interfaces.
            Reply in Chinese. End with verdict: pass / revise / reject.
          claude_args: |
            --model deepseek-v4-flash
            --max-turns ${{ steps.analyze.outputs.max_turns }}
