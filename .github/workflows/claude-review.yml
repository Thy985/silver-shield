name: Claude Review
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  auto-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Analyze PR size
        id: analyze
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          DIFF=$(git diff --shortstat origin/$BASE_REF...HEAD 2>/dev/null || true)
          eval $(echo "$DIFF" | awk '{
            for(i=1;i<=NF;i++) {
              if($i ~ /file/) print "FILES=" $(i-1)
              if($i ~ /insert/) print "ADDED=" $(i-1)
              if($i ~ /delet/) print "DELETED=" $(i-1)
            }
          }')
          ADDED=${ADDED:-0}; DELETED=${DELETED:-0}; FILES=${FILES:-0}
          TOTAL=$((ADDED + DELETED))

          echo "files=$FILES" >> "$GITHUB_OUTPUT"
          echo "added=$ADDED" >> "$GITHUB_OUTPUT"
          echo "deleted=$DELETED" >> "$GITHUB_OUTPUT"
          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"

          CHANGED=$(git diff --name-only origin/$BASE_REF...HEAD 2>/dev/null || true)

          HAS_INFRA="false"
          echo "$CHANGED" | grep -qE '(schema|migration|docker|k8s|deploy|\.github/workflows)' && HAS_INFRA="true" || true
          echo "has_infra=$HAS_INFRA" >> "$GITHUB_OUTPUT"

          NEW_DIRS=$(git diff --diff-filter=A --name-only origin/$BASE_REF...HEAD 2>/dev/null | xargs -I{} dirname {} 2>/dev/null | sort -u | grep -v '^\.$' | wc -l)
          echo "new_dirs=${NEW_DIRS:-0}" >> "$GITHUB_OUTPUT"

          HAS_TESTS="false"
          echo "$CHANGED" | grep -qE '(test|spec|__tests__)' && HAS_TESTS="true" || true
          echo "has_tests=$HAS_TESTS" >> "$GITHUB_OUTPUT"

          if [ "$TOTAL" -le 30 ] && [ "$FILES" -le 3 ]; then
            echo "level=0" >> "$GITHUB_OUTPUT"
            echo "level_name=Level 0" >> "$GITHUB_OUTPUT"
            echo "max_turns=10" >> "$GITHUB_OUTPUT"
          elif [ "$TOTAL" -le 300 ] && [ "$FILES" -le 15 ]; then
            echo "level=1" >> "$GITHUB_OUTPUT"
            echo "level_name=Level 1" >> "$GITHUB_OUTPUT"
            echo "max_turns=20" >> "$GITHUB_OUTPUT"
          elif [ "$TOTAL" -le 1000 ] && [ "$FILES" -le 30 ]; then
            echo "level=2" >> "$GITHUB_OUTPUT"
            echo "level_name=Level 2" >> "$GITHUB_OUTPUT"
            echo "max_turns=30" >> "$GITHUB_OUTPUT"
          else
            echo "level=3" >> "$GITHUB_OUTPUT"
            echo "level_name=Level 3" >> "$GITHUB_OUTPUT"
            echo "max_turns=40" >> "$GITHUB_OUTPUT"
          fi

      - uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_BASE_URL: https://api.deepseek.com/anthropic
          ANTHROPIC_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR: ${{ github.event.pull_request.number }} - ${{ github.event.pull_request.title }}

            Changes: ${{ steps.analyze.outputs.added }}+/${{ steps.analyze.outputs.deleted }}- in ${{ steps.analyze.outputs.files }} files
            New dirs: ${{ steps.analyze.outputs.new_dirs }}, Infra: ${{ steps.analyze.outputs.has_infra }}, Tests: ${{ steps.analyze.outputs.has_tests }}
            Level: ${{ steps.analyze.outputs.level_name }}

            ---

            [Level 0] Quick check: solves the problem? introduces bugs? tests pass? code style OK? Reply in 10 lines max.

            [Level 1] Code Review:
            Code: clear? duplicate? maintainable?
            Test: core paths covered? edge cases?
            Interface: breaks existing APIs? data structure OK?
            Use inline comment for specific issues.

            [Level 2] Design Review (add to Level 1):
            Design: module boundaries? data ownership? extensibility? need ADR?
            Impact: scope? data migration? phased rollout?
            Output design review first, then code review.

            [Level 3] Architecture Review (add to Level 1+2):
            Architecture: scalability? resilience? performance? security? ops cost?
            Output full architecture review with risk matrix.

            Reply in Chinese.
            Final verdict: pass / revise / reject
          claude_args: |
            --model deepseek-v4-flash
            --max-turns ${{ steps.analyze.outputs.max_turns }}
