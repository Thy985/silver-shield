version: "1.0"
name: 构建、上传、发布、部署到自有主机
displayName: 构建、上传、发布、部署到自有主机
stages:
- name: 构建
  displayName: 构建
  strategy: naturally
  trigger: auto
  steps:
  - step: build@python
    name: ""
    displayName: Python 构建
    pythonVersion: "3.12" # 升级 Python 版本
    commands:
    - pip config set global.index-url https://pypi.tuna.tsinghua.edu.cn/simple
    - pip install --upgrade pip
    - pip install -r requirements.txt
    - pip install -r requirements-dev.txt
    - pip install -e .
    # 这里可以加入你的测试命令，确保构建的代码是可用的
    - pytest
    artifacts:
    - name: BUILD_ARTIFACT
      path:
      - ./
      type: .tar.gz
    notify: []
    strategy:
      retry: "0"
      resource:
        cpu: "2"
        memory: "4"
- name: 上传
  displayName: 上传
  strategy: naturally
  trigger: auto
  steps:
  - step: publish@general_artifacts
    name: ""
    displayName: 上传制品
    dependArtifact: BUILD_ARTIFACT
    artifactName: output
    notify: []
    strategy:
      retry: "0"
      resource:
        cpu: "2"
        memory: "4"
- name: 发布
  displayName: 发布
  strategy: naturally
  trigger: auto
  steps:
  - step: publish@release_artifacts
    name: ""
    displayName: 发布
    dependArtifact: output
    version: 1.0.0.0
    autoIncrement: true
    notify: []
    strategy:
      retry: "0"
      resource:
        cpu: "2"
        memory: "4"
- name: 部署
  displayName: 部署
  strategy: naturally
  trigger: auto
  steps:
  - step: deploy@agent
    name: ""
    displayName: 主机部署
    deployArtifact:
    - name: output
      target: "~/gitee_go/deploy"
      source: artifact
      dependArtifact: ""
      artifactRepository: default
      artifactName: output
      artifactVersion: latest
    script: |-
      # 部署脚本示例
      # 进入部署目录
      cd ~/gitee_go/deploy
      # 重新安装依赖（确保环境干净）
      pip install -r requirements.txt
      # 启动你的 Python 应用，例如使用 nohup 后台运行
      # nohup python main.py > app.log 2>&1 &
      echo '部署完成！'
    hostGroupID: {}
    notify: []
    strategy:
      retry: "0"
triggers:
  trigger: manual
notify: []
strategy:
  blocking: true