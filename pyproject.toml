[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "home-perception"
version = "0.1.0"
description = "SilverShield Home 感知模块 - 基于萤石摄像头的家庭入口实时感知与诈骗风险证据采集"
readme = "README.md"
requires-python = ">=3.11"

# 运行时核心依赖（MVP）：必须声明，否则 `pip install -e ".[demo]"` 缺基础包导致导入失败。
# home_perception 导入链在模块加载期即需要 structlog / pyyaml / pydantic / numpy /
# opencv-python / ultralytics（runtime.pipeline 顶层 import detection.detector → ultralytics/cv2/torch）。
# 单一来源：requirements.txt 已同步收敛为 `-e .[demo]`。
dependencies = [
    "opencv-python>=4.9.0",
    "numpy>=1.26.0",
    "requests>=2.31.0",
    "pyyaml>=6.0.1",
    "pydantic>=2.6.0",
    "ultralytics>=8.2.0",
    "paho-mqtt>=2.0.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.1.0",
]

# P0-11 展示层依赖（ADR-0015 §2.3）：fastapi / uvicorn / websockets 仅用于 Demo 网关，
# 核心 home_perception 包保持零 Web 依赖（设备端 / 边缘部署 / 模型测试不受污染）。
# 安装：pip install -e ".[demo]"
[project.optional-dependencies]
demo = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "websockets>=12.0",
    "python-multipart>=0.0.9",  # P0-11.4 视频上传端点（UploadFile / multipart 表单）
]
# 音频 fixture 生成基础设施（仅开发期重新生成 tests/fixtures/audio/*.wav 时需要，
# 不进入运行时 / CI 默认依赖）。TTS 用 edge-tts（免费、无需密钥）；MP3→WAV 解码用 av（PyAV）。
# 注意：音频运行时管道（src/home_perception/audio/*）零模型、纯 numpy + 标准库 wave，
# 不依赖本 extra；本 extra 仅用于「生成 fixture」这一开发动作。
audio-dev = [
    "edge-tts>=6.1",
    "av>=11.0",  # PyAV，MP3 字节解码为 numpy（仅生成期用，管道不依赖）
]
# Tier1 真实推理路径（ADR-0026 §3 · YAMNet）：仅当 audio.tier1.enabled=true 且配权重时需要，
# 经 onnxruntime 惰性加载；核心管道（Tier0 + 触发接线）纯 numpy，不依赖本 extra。
# 安装：pip install -e ".[audio]"
#
# 供应链安全（评审 3.2）：onnxruntime 含原生扩展，是已知投毒高风险包；此处将其上界锁定在 1.16.x，
# 避免意外拉入 1.17+/2.x 引入行为/二进制差异。强化部署建议：进一步 pin 到精确版本
# （==1.16.x）、走私有 index、并配合 --require-hashes。audio.tier1.enabled 默认 False
# （feature flag），CI 不会主动安装本 extra——这是首要缓解。
# scipy 在真实路径用于 signal.resample_poly（抗混叠重采样）；缺失时退化为 np.interp 近似。
audio = [
    "onnxruntime>=1.16,<1.17",
    "scipy>=1.11",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# ADR-0035 D1：vendored ECharts 随包发布（评审 R2-#8）——否则 pip install 后
# _echarts_inline() 读不到资产，graph 视图空白。
"home_perception.visualizer" = ["assets/*.js", "assets/*.md"]

[tool.ruff]
line-length = 100
target-version = "py311"
# 工程资产库（silver-engineering-assets/）是教学示例骨架，非生产代码；
# 不参与 lint/format，避免示例代码风格阻塞 PR。
extend-exclude = ["silver-engineering-assets"]

[tool.black]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
markers = [
    "e2e: 端到端浏览器测试（需要运行中的网关 + playwright）",
    "slow: 耗时测试（单独启用）",
]
